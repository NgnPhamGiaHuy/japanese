name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The Next.js app (package.json, tsconfig, etc.) lives in src/, not the repo root.
    working-directory: src

env:
  NODE_VERSION: "20"

jobs:
  # Fast stage: typecheck (via build), lint, unit tests. No emulator, no Java needed.
  build-lint-test:
    name: Build, Lint, Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # BLOCKING as of Sprint 0. Previously report-only (continue-on-error)
        # because 12 files carried error-level violations predating this
        # workflow. Those exact files are now pinned to "warn" by the ratchet
        # baseline in src/eslint.config.mjs, so this step fails only on NEW
        # error-level violations — including the ADR-001 audio boundary and the
        # import-boundary rules arriving with T-101c.
        #
        # Architecture-boundary enforcement (ADR-101/102/103) is defined as
        # "the rule is set to error and the build fails". Without this step
        # blocking, that second half was never true.
        # See execution-readiness/06 §G-1.
        run: npm run lint

      - name: Vocabulary agreement (ADR-108/ADR-115)
        # Fails only on an "enforce"-mode mismatch between a TS union, its
        # firestore.rules list, and its writers (e.g. DeckAccessRole,
        # LogSource). The notification-type target runs report-only until
        # T-108a (Wave 5) widens that union — see
        # scripts/check-vocabulary-agreement.mjs's own docblock.
        run: npm run check:vocab

      - name: Build (includes TypeScript typecheck)
        run: npm run build
        env:
          # Placeholder Firebase client config so `next build` can statically
          # analyze pages that reference these NEXT_PUBLIC_* vars. No real
          # secrets are used or required for build/lint/unit-test.
          NEXT_PUBLIC_FIREBASE_API_KEY: "ci-placeholder"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "ci-placeholder.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "ci-placeholder"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "ci-placeholder.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
          NEXT_PUBLIC_FIREBASE_APP_ID: "ci-placeholder"

      - name: Unit tests
        run: npm run test

  # Emulator stage: the Firestore/Auth security-rules suite. Needs a JVM
  # (firebase-tools >=15.24 requires JDK 21+) and no real Firebase project —
  # the emulator runs entirely locally in the runner.
  emulator-rules-tests:
    name: Firestore/Auth Rules (Emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Set up JDK (required by the Firestore/Auth emulators)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run emulator-backed rules suite
        run: npm run test:emu

  # Functions stage: the functions/ package (E14-T2) — a separate Node
  # package (own package.json/tsconfig, deployed independently of the
  # Next.js app), so it gets its own install/build/lint/test rather than
  # folding into build-lint-test above. Tests run against the
  # Firestore/Functions/Storage emulators (not the app's Firestore/Auth
  # ones) via functions/'s own test:emu script.
  functions-tests:
    name: Cloud Functions (Emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/functions/package-lock.json

      - name: Set up JDK (required by the Firestore/Functions emulators)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        working-directory: src/functions
        run: npm ci

      - name: Typecheck + build
        working-directory: src/functions
        run: npm run build

      - name: Lint
        working-directory: src/functions
        run: npm run lint

      - name: Run emulator-backed tests
        working-directory: src/functions
        run: npm run test:emu

  # Browser stage: Playwright E2E (auth + realtime journeys) AND Vitest
  # Browser Mode component tests share this job — both need the same
  # Chromium install (one download, not two), and both need the JVM for the
  # Firestore/Auth emulator the E2E suite starts. playwright.config.ts starts
  # its own emulator + dedicated Next dev server (port 3100); nothing here
  # depends on the other jobs' state.
  e2e-tests:
    name: Browser Tests (E2E + Component)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Set up JDK (required by the Firestore/Auth emulators)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Component tests (Vitest Browser Mode)
        run: npm run test:browser

      - name: Run Playwright E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/playwright-report/
          retention-days: 14

  # Deploys functions/ once FIREBASE_PROJECT_ID (repo variable) and
  # FIREBASE_SERVICE_ACCOUNT (repo secret, a least-privilege deploy-only
  # service account's JSON key) are configured in this repo's Settings →
  # Secrets and variables → Actions. Until then this job is a clean skip, not
  # a failure — deploying real Cloud Functions needs a real Firebase
  # project's credentials, which this repo doesn't have configured yet (same
  # "code-complete, activation needs real credentials" pattern as E5-T1's
  # Sentry / E5-T3's PostHog init).
  deploy-functions:
    name: Deploy Functions
    needs: [functions-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: src/functions/package-lock.json

      - name: Install app dependencies (provides the firebase CLI)
        run: npm ci

      - name: Install functions dependencies
        working-directory: src/functions
        run: npm ci

      - name: Write deploy service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${{ runner.temp }}/firebase-sa.json"

      - name: Deploy functions
        run: >
          npx firebase-tools deploy --only functions
          --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
